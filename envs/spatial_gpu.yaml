name: spatial_gpu
channels:
  - rapidsai
  - nvidia
  - conda-forge
  - bioconda
dependencies:
  - python=3.12
  - rapids>=25.04
  - rapids-dask-dependency>=25.4
  - cuda-version>=12.0,<=12.8
  - dask>=2025.12,<2026.1.2
  - distributed<2026.1.2
  - imagecodecs>=2025.8.2,<2026
  - python-annoy=1.17.3
  - jax
  - ray-tune
  - pip
  - ipykernel
  - ipython
  - ipywidgets
  - widgetsnbextension
  - jupyter
  - jupyterlab
  - nb_conda_kernels
  - pygraphviz
  - memray
  - pip:
      - -r requirements-spatial.txt
      - -r requirements-dev.txt
      - -r requirements-gpu.txt
